<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تقطيع الفواكه</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }
        canvas {
            background: linear-gradient(to bottom, #2c3e50, #3498db);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: crosshair;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // إعدادات اللعبة
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameState = 'START'; // START, PLAYING, GAMEOVER

        let fruits = [];
        let particles = [];
        let trail = [];

        // تعريف الفواكه المتاحة
        const fruitTypes = [
            { name: 'تفاحة', color: '#e74c3c', inner: '#f1c40f', radius: 35 },
            { name: 'برتقالة', color: '#e67e22', inner: '#f39c12', radius: 32 },
            { name: 'بطيخ', color: '#27ae60', inner: '#e74c3c', radius: 45 },
            { name: 'موز', color: '#f1c40f', inner: '#f39c12', radius: 30 }
        ];

        class Fruit {
            constructor() {
                this.x = Math.random() * (canvas.width - 200) + 100;
                this.y = canvas.height + 50;
                let angle = Math.random() * 0.5 - 0.25; 
                let speed = Math.random() * 4 + 11 + (level * 0.5);
                this.vx = angle * 10;
                this.vy = -speed;
                this.gravity = 0.35;
                this.type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
                this.sliced = false;
                this.rotation = 0;
                this.rotSpeed = Math.random() * 0.1 - 0.05;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.rotSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.beginPath();
                ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.type.color;
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, this.type.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = this.type.inner;
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1;
                this.life = Math.random() * 20 + 20;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 1 / this.life;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // نظام التعامل مع حركة القطع (سواء بالماوس أو اللمس)
        let isSwiping = false;

        function startSwipe(x, y) {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
                return;
            }
            isSwiping = true;
            trail = [{ x, y, time: Date.now() }];
        }

        function moveSwipe(x, y) {
            if (!isSwiping || gameState !== 'PLAYING') return;

            trail.push({ x, y, time: Date.now() });

            // التحقق من تقاطع خط السحب مع الفواكه
            fruits.forEach(fruit => {
                if (!fruit.sliced) {
                    let dist = Math.hypot(fruit.x - x, fruit.y - y);
                    if (dist < fruit.type.radius + 10) { // توسيع مساحة القطع قليلاً لسهولة الاستجابة
                        fruit.sliced = true;
                        score += 10;
                        level = Math.floor(score / 100) + 1;

                        for (let i = 0; i < 15; i++) {
                            particles.push(new Particle(fruit.x, fruit.y, fruit.type.inner));
                        }
                    }
                }
            });
        }

        function endSwipe() {
            isSwiping = false;
        }

        // ربط الأحداث (الماوس)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startSwipe(e.clientX - rect.left, e.clientY - rect.top);
        });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            moveSwipe(e.clientX - rect.left, e.clientY - rect.top);
        });
        window.addEventListener('mouseup', endSwipe);

        // ربط الأحداث (الهواتف وشاشات اللمس)
        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            startSwipe(touch.clientX - rect.left, touch.clientY - rect.top);
            e.preventDefault();
        });
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            moveSwipe(touch.clientX - rect.left, touch.clientY - rect.top);
            e.preventDefault();
        });
        window.addEventListener('touchend', endSwipe);

        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            fruits = [];
            particles = [];
            trail = [];
        }

        let spawnTimer = 0;
        function handleSpawns() {
            spawnTimer++;
            let spawnInterval = Math.max(30, 90 - (level * 10));
            if (spawnTimer > spawnInterval) {
                fruits.push(new Fruit());
                spawnTimer = 0;
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'START') {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('لعبة تقطيع الفواكه', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '20px sans-serif';
                ctx.fillText('انقر واسحب الماوس بسرعة لقطع الفواكه', canvas.width / 2, canvas.height / 2 + 20);
            } 
            else if (gameState === 'PLAYING') {
                handleSpawns();

                for (let i = fruits.length - 1; i >= 0; i--) {
                    let f = fruits[i];
                    f.update();
                    f.draw();

                    if (f.y > canvas.height + 60 && !f.sliced) {
                        lives--;
                        fruits.splice(i, 1);
                        if (lives <= 0) {
                            gameState = 'GAMEOVER';
                        }
                    } else if (f.y > canvas.height + 60 && f.sliced) {
                        fruits.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.update();
                    p.draw();
                    if (p.alpha <= 0) particles.splice(i, 1);
                }

                // رسم خط السحب الأبيض
                if (trail.length > 1) {
                    ctx.beginPath();
                    for (let i = 0; i < trail.length; i++) {
                        let pt = trail[i];
                        if (i === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    }
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // تنظيف المسار القديم بسرعة ليختفي الأثر
                trail = trail.filter(pt => Date.now() - pt.time < 120);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`النقاط: ${score}`, canvas.width - 30, 40);
                ctx.textAlign = 'left';
                ctx.fillText(`المرحلة: ${level}`, 30, 40);
                ctx.fillText(`القلوب: ${'❤️ '.repeat(lives)}`, 30, 80);
            } 
            else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 45px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('انتهت اللعبة!', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '24px sans-serif';
                ctx.fillText(`مجموع نقاطك: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.font = '18px sans-serif';
                ctx.fillText('انقر لإعادة المحاولة', canvas.width / 2, canvas.height / 2 + 60);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
