<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة قتال الأسلحة - الحلبة البيضاء الثابتة</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(20, 20, 20, 0.85);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        h2 { margin: 0 0 3px 0; font-size: 13px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
        .score-val { font-size: 24px; font-weight: 900; color: #ffffff; text-shadow: 0 0 10px #ffffff; }

        /* أزرار التحكم باللمس للهواتف */
        .controls-layer {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 20;
            pointer-events: none;
        }
        .action-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
        }
        .control-btn:active, .control-btn.active {
            background: rgba(255, 255, 255, 0.6);
            color: #000000;
            transform: scale(0.92);
            box-shadow: 0 0 20px #ffffff;
        }
        .fire-btn {
            border-color: #00ffff;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.2);
            width: 85px;
            height: 85px;
        }
        .fire-btn:active {
            background: rgba(0, 255, 255, 0.8);
            color: #000;
            box-shadow: 0 0 25px #00ffff;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h2>النقاط المحرزة</h2>
        <div class="score-val"><span id="scoreDisplay">0</span> نقطة</div>
    </div>

    <!-- أزرار اللمس للتحركة وإطلاق النار -->
    <div class="controls-layer">
        <div class="action-group">
            <div class="control-btn" id="leftBtn">◀</div>
            <div class="control-btn" id="rightBtn">▶</div>
        </div>
        <div class="action-group">
            <div class="control-btn" id="upBtn">▲</div>
            <div class="control-btn fire-btn" id="fireBtn">💥</div>
        </div>
    </div>

    <!-- استدعاء مكتبة الجرافيك العالمية Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- إعداد بيئة العرض والمشهد بإضاءة بيضاء ناصعة ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.01);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- إضاءة بيضاء نقية ساطعة ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(40, 100, 40);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
        fillLight.position.set(-40, 50, -40);
        scene.add(fillLight);

        // --- بناء الحلبة الدائرية الثابتة ---
        const arenaGroup = new THREE.Group();
        
        const floorGeo = new THREE.CylinderGeometry(45, 45, 2.5, 64);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.3, metalness: 0.5 });
        const arenaFloor = new THREE.Mesh(floorGeo, floorMat);
        arenaFloor.position.y = -1.25;
        arenaFloor.receiveShadow = true;
        arenaGroup.add(arenaFloor);

        // حافة الحلبة البيضاء المضيئة والثابتة
        const ringGeo = new THREE.TorusGeometry(45, 0.8, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x555555 });
        const arenaRing = new THREE.Mesh(ringGeo, ringMat);
        arenaRing.rotation.x = Math.PI / 2;
        arenaRing.position.y = 0;
        arenaGroup.add(arenaRing);

        scene.add(arenaGroup);

        // --- تصميم شكل اللاعب (مقاتل أبيض متطور) ---
        function createPlayerModel() {
            const player = new THREE.Group();
            
            // الجسم الأساسي
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            player.add(body);

            // خوذة اللاعب
            const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.9 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(0, 2.0, 0);
            head.castShadow = true;
            player.add(head);

            // السلاح البارز
            const gunGeo = new THREE.BoxGeometry(0.3, 0.3, 1.3);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.95 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.65, 1.1, 0.6);
            player.add(gun);

            return player;
        }

        const player = createPlayerModel();
        player.position.set(0, 0, 15);
        scene.add(player);

        // --- تصميم الأعداء (NPCs أشكال هندسية بيضاء واضحة) ---
        const enemies = [];
        function spawnEnemyModel() {
            const enemy = new THREE.Group();
            
            const eBodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.8);
            const eBodyMat = new THREE.MeshStandardMaterial({ color: 0xdcdcdc, roughness: 0.3, metalness: 0.6 });
            const eBody = new THREE.Mesh(eBodyGeo, eBodyMat);
            eBody.position.y = 0.9;
            eBody.castShadow = true;
            enemy.add(eBody);

            const eHeadGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const eHeadMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const eHead = new THREE.Mesh(eHeadGeo, eHeadMat);
            eHead.position.set(0, 2.0, 0);
            enemy.add(eHead);

            // توزيع الأعداء على محيط الحلبة الدائرية الثابتة
            const angle = Math.random() * Math.PI * 2;
            const radius = 30 + Math.random() * 10;
            enemy.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            enemy.angle = angle;
            enemy.radius = radius;
            
            scene.add(enemy);
            enemies.push(enemy);
        }

        // إنشاء 6 أعداء في الحلبة
        for(let i=0; i<6; i++) spawnEnemyModel();

        // --- نظام إطلاق الرصاص البيضاء ---
        const bullets = [];
        function fireBullet() {
            const bulletGeo = new THREE.SphereGeometry(0.28, 16, 16);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(player.position);
            bullet.position.y += 1.1;
            
            const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            bullet.velocity = dir.multiplyScalar(1.3);
            
            scene.add(bullet);
            bullets.push(bullet);
        }

        // --- أزرار التحكم باللمس واللوحة ---
        const controls = { left: false, right: false, forward: false };

        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); controls[key] = true; el.classList.add('active'); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); controls[key] = false; el.classList.remove('active'); }, { passive: false });
        };

        bindTouch('leftBtn', 'left');
        bindTouch('rightBtn', 'right');
        bindTouch('upBtn', 'forward');
        
        const fireEl = document.getElementById('fireBtn');
        fireEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            fireBullet();
            fireEl.classList.add('active');
        }, { passive: false });
        fireEl.addEventListener('touchend', (e) => {
            e.preventDefault();
            fireEl.classList.remove('active');
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = true;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = true;
            if (e.key === ' ') fireBullet();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = false;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = false;
        });

        let score = 0;

        // --- حلقة اللعبة الأساسية (ثبات تام ودقة عالية) ---
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            // حركة اللاعب وانعطافه بدقة
            if (controls.left) player.rotation.y += 0.045;
            if (controls.right) player.rotation.y -= 0.045;

            if (controls.forward) {
                const moveDir = new THREE.Vector3(0, 0, -0.38).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
                player.position.add(moveDir);
            }

            // منع اللاعب من تجاوز حدود الحلبة الثابتة
            const distFromCenter = Math.sqrt(player.position.x ** 2 + player.position.z ** 2);
            if (distFromCenter > 42) {
                player.position.normalize().multiplyScalar(42);
            }

            // تحديث الرصاصات واكتشاف الاصطدام بالأعداء بدقة
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.position.add(b.velocity);

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (b.position.distanceTo(en.position) < 1.6) {
                        scene.remove(en);
                        enemies.splice(j, 1);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        
                        score += 100;
                        document.getElementById('scoreDisplay').innerText = score;

                        spawnEnemyModel();
                        break;
                    }
                }

                if (b && b.position.length() > 60) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // تحرك الأعداء بسلاسة وثبات حول الحلبة
            enemies.forEach(en => {
                en.angle += 0.012;
                en.position.x = Math.cos(en.angle) * en.radius;
                en.position.z = Math.sin(en.angle) * en.radius;
            });

            // كاميرا سينمائية ثابتة ومستقرة خلف اللاعب تماماً
            const camOffset = new THREE.Vector3(0, 4.5, 10);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            camera.position.copy(player.position).add(camOffset);
            
            const lookTarget = player.position.clone();
            lookTarget.y += 1.2;
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        gameLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
