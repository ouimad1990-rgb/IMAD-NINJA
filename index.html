<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة القتال الاحترافية - السماء المسائية المضاءة بالبيض</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121622;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(15, 18, 28, 0.85);
            padding: 12px 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        h2 { margin: 0 0 3px 0; font-size: 13px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
        .score-val { font-size: 24px; font-weight: 900; color: #ffffff; text-shadow: 0 0 10px #ffffff; }

        /* أزرار التحكم باللمس للهواتف */
        .controls-layer {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 20;
            pointer-events: none;
        }
        .action-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
        }
        .control-btn:active, .control-btn.active {
            background: rgba(255, 255, 255, 0.8);
            color: #000000;
            transform: scale(0.92);
            box-shadow: 0 0 20px #ffffff;
        }
        .fire-btn {
            border-color: #00ffff;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.2);
            width: 85px;
            height: 85px;
        }
        .fire-btn:active {
            background: rgba(0, 255, 255, 0.9);
            color: #000;
            box-shadow: 0 0 25px #00ffff;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h2>النقاط المحرزة</h2>
        <div class="score-val"><span id="scoreDisplay">0</span> نقطة</div>
    </div>

    <!-- أزرار اللمس -->
    <div class="controls-layer">
        <div class="action-group">
            <div class="control-btn" id="leftBtn">◀</div>
            <div class="control-btn" id="rightBtn">▶</div>
        </div>
        <div class="action-group">
            <div class="control-btn" id="upBtn">▲</div>
            <div class="control-btn fire-btn" id="fireBtn">💥</div>
        </div>
    </div>

    <!-- استدعاء مكتبة الجرافيك العالمية Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. إعداد المشهد والسماء المسائية المضاءة بالبيض ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a334a); // سماء مسائية مضاءة بلون أزرق مائل للبيض والأفق النظيف
        scene.fog = new THREE.FogExp2(0x2a334a, 0.007);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);

        // نجوم ناعمة في السماء المسائية
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 400;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i+=3) {
            starPositions[i] = (Math.random() - 0.5) * 900;
            starPositions[i+1] = Math.random() * 250 + 60;
            starPositions[i+2] = (Math.random() - 0.5) * 900;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // --- إضاءة بيضاء ساطعة ومتوهجة ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
        sunLight.position.set(50, 120, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- بناء الأرضية البيضاء بالكامل (Pure White Arena) ---
        const arenaGroup = new THREE.Group();
        
        const floorGeo = new THREE.CylinderGeometry(45, 45, 2.5, 64);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0.05 });
        const arenaFloor = new THREE.Mesh(floorGeo, floorMat);
        arenaFloor.position.y = -1.25;
        arenaFloor.receiveShadow = true;
        arenaGroup.add(arenaFloor);

        // حافة الحلبة النيون البيضاء المتوهجة
        const ringGeo = new THREE.TorusGeometry(45, 0.6, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const arenaRing = new THREE.Mesh(ringGeo, ringMat);
        arenaRing.rotation.x = Math.PI / 2;
        arenaRing.position.y = 0;
        arenaGroup.add(arenaRing);

        scene.add(arenaGroup);

        // --- 2. تصميم شخصيات بشرية واقعية بالكامل ---
        function createHumanoidModel(isPlayer = false) {
            const character = new THREE.Group();

            const suitColor = isPlayer ? 0x1a1a1a : 0xdcdcdc; // اللاعب أسود تكتيكي، الأعداء رمادي فاتح
            const accentColor = isPlayer ? 0x00ffff : 0xff0055;

            const material = new THREE.MeshStandardMaterial({ color: suitColor, roughness: 0.35, metalness: 0.5 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.8 });
            const accentMat = new THREE.MeshStandardMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.6 });

            // الرأس
            const headGeo = new THREE.BoxGeometry(0.5, 0.6, 0.5);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 2.1;
            head.castShadow = true;
            character.add(head);

            // الجذع
            const torsoGeo = new THREE.BoxGeometry(0.8, 1.0, 0.45);
            const torso = new THREE.Mesh(torsoGeo, material);
            torso.position.y = 1.3;
            torso.castShadow = true;
            character.add(torso);

            // درع الصدر المضيء
            const armorGeo = new THREE.BoxGeometry(0.6, 0.5, 0.1);
            const armor = new THREE.Mesh(armorGeo, accentMat);
            armor.position.set(0, 1.35, 0.24);
            character.add(armor);

            // الذراعين
            const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25);
            const leftArm = new THREE.Mesh(armGeo, material);
            leftArm.position.set(-0.55, 1.3, 0);
            leftArm.castShadow = true;
            character.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, material);
            rightArm.position.set(0.55, 1.3, 0);
            rightArm.castShadow = true;
            character.add(rightArm);

            // السلاح (بندقية واقعية)
            const gunBodyGeo = new THREE.BoxGeometry(0.18, 0.22, 1.2);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.95, roughness: 0.15 });
            const gun = new THREE.Mesh(gunBodyGeo, gunMat);
            gun.position.set(0.4, 1.1, 0.5);
            gun.castShadow = true;
            character.add(gun);

            // الساقين
            const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
            const leftLeg = new THREE.Mesh(legGeo, material);
            leftLeg.position.set(-0.22, 0.45, 0);
            leftLeg.castShadow = true;
            character.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, material);
            rightLeg.position.set(0.22, 0.45, 0);
            rightLeg.castShadow = true;
            character.add(rightLeg);

            return character;
        }

        const player = createHumanoidModel(true);
        player.position.set(0, 0, 15);
        scene.add(player);

        const enemies = [];
        function spawnEnemy() {
            const enemy = createHumanoidModel(false);
            
            const angle = Math.random() * Math.PI * 2;
            const radius = 30 + Math.random() * 10;
            enemy.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            enemy.angle = angle;
            enemy.radius = radius;
            
            scene.add(enemy);
            enemies.push(enemy);
        }

        for(let i=0; i<6; i++) spawnEnemy();

        // --- نظام إطلاق الرصاص ---
        const bullets = [];
        function fireBullet() {
            const bulletGeo = new THREE.SphereGeometry(0.28, 16, 16);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(player.position);
            bullet.position.y += 1.3;
            
            const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            bullet.velocity = dir.multiplyScalar(1.4);
            
            scene.add(bullet);
            bullets.push(bullet);
        }

        // --- أزرار التحكم باللمس واللوحة ---
        const controls = { left: false, right: false, forward: false };

        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); controls[key] = true; el.classList.add('active'); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); controls[key] = false; el.classList.remove('active'); }, { passive: false });
        };

        bindTouch('leftBtn', 'left');
        bindTouch('rightBtn', 'right');
        bindTouch('upBtn', 'forward');
        
        const fireEl = document.getElementById('fireBtn');
        fireEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            fireBullet();
            fireEl.classList.add('active');
        }, { passive: false });
        fireEl.addEventListener('touchend', (e) => {
            e.preventDefault();
            fireEl.classList.remove('active');
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = true;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = true;
            if (e.key === ' ') fireBullet();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = false;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = false;
        });

        let score = 0;

        // --- حلقة تشغيل اللعبة الأساسية (Game Loop) ---
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (controls.left) player.rotation.y += 0.045;
            if (controls.right) player.rotation.y -= 0.045;

            if (controls.forward) {
                const moveDir = new THREE.Vector3(0, 0, -0.4).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
                player.position.add(moveDir);
            }

            const distFromCenter = Math.sqrt(player.position.x ** 2 + player.position.z ** 2);
            if (distFromCenter > 42) {
                player.position.normalize().multiplyScalar(42);
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.position.add(b.velocity);

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (b.position.distanceTo(en.position) < 1.6) {
                        scene.remove(en);
                        enemies.splice(j, 1);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        
                        score += 100;
                        document.getElementById('scoreDisplay').innerText = score;

                        spawnEnemy();
                        break;
                    }
                }

                if (b && b.position.length() > 60) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            enemies.forEach(en => {
                en.angle += 0.012;
                en.position.x = Math.cos(en.angle) * en.radius;
                en.position.z = Math.sin(en.angle) * en.radius;
            });

            const camOffset = new THREE.Vector3(0, 4.2, 9.5);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            camera.position.copy(player.position).add(camOffset);
            
            const lookTarget = player.position.clone();
            lookTarget.y += 1.3;
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        gameLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
